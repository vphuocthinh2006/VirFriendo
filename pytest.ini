[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    ml: NLP/ViT helpers (may need torch/transformers/timm).
    integration: Loads checkpoints or large assets; may skip if files missing.
    slow: ViT encode smoke (set RUN_VIT_SMOKE=1).

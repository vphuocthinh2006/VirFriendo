# Build & push to Amazon ECR (API + web).

name: ECR publish

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ECR_REPOSITORY_API: virfriendo-api
  ECR_REPOSITORY_WEB: virfriendo-web
  ECS_CLUSTER: virfriendo-cluster
  ECS_SERVICE_API: virfriendo-api-svc
  ECS_TASK_FAMILY_API: virfriendo-api
  ECS_CONTAINER_API: api
  API_HEALTHCHECK_URL: https://api.virfriendo.win/health

jobs:
  push-api:
    runs-on: ubuntu-latest
    outputs:
      api_image_tag: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error::No Dockerfile found at root."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve API image tag
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REPO_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "api_image_uri=$REPO_URI:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.vars.outputs.api_image_uri }}
          labels: ${{ steps.meta.outputs.labels }}

  push-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend Dockerfile exists
        run: |
          if [ ! -f frontend/Dockerfile ]; then
            echo "::error::No frontend/Dockerfile found."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Vite public API URL
        id: vite
        shell: bash
        run: |
          V="${{ vars.VITE_PUBLIC_API_URL }}"
          if [ -z "$V" ]; then
            echo "::error::Missing repository variable VITE_PUBLIC_API_URL"
            exit 1
          fi
          echo "url=$V" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ steps.vite.outputs.url }}

  deploy-api:
    name: Deploy API to ECS
    runs-on: ubuntu-latest
    needs: [push-api]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve deploy configuration
        id: cfg
        shell: bash
        run: |
          echo "cluster=${{ vars.ECS_CLUSTER || env.ECS_CLUSTER }}" >> "$GITHUB_OUTPUT"
          echo "service=${{ vars.ECS_SERVICE_API || env.ECS_SERVICE_API }}" >> "$GITHUB_OUTPUT"
          echo "task_family=${{ vars.ECS_TASK_FAMILY_API || env.ECS_TASK_FAMILY_API }}" >> "$GITHUB_OUTPUT"
          echo "container=${{ vars.ECS_CONTAINER_API || env.ECS_CONTAINER_API }}" >> "$GITHUB_OUTPUT"
          echo "health_url=${{ vars.API_HEALTHCHECK_URL || env.API_HEALTHCHECK_URL }}" >> "$GITHUB_OUTPUT"

      - name: Capture current task definition
        id: previous
        shell: bash
        run: |
          CURR_TD=$(aws ecs describe-services \
            --cluster "${{ steps.cfg.outputs.cluster }}" \
            --services "${{ steps.cfg.outputs.service }}" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "current_task_definition=$CURR_TD" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render new task definition with immutable image
        shell: bash
        run: |
          API_IMAGE_TAG="${{ needs['push-api'].outputs.api_image_tag }}"
          if [ -z "$API_IMAGE_TAG" ]; then
            echo "::error::Missing needs.push-api.outputs.api_image_tag (empty image tag)."
            exit 1
          fi
          API_IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:$API_IMAGE_TAG"
          aws ecs describe-task-definition \
            --task-definition "${{ steps.cfg.outputs.task_family }}" \
            --query 'taskDefinition' > task-definition.json
          python .github/scripts/render_taskdef.py \
            task-definition.json \
            task-definition.rendered.json \
            "${{ steps.cfg.outputs.container }}" \
            "$API_IMAGE_URI"

      - name: Register task definition revision
        id: register
        shell: bash
        run: |
          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_definition=$NEW_TD" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        shell: bash
        run: |
          aws ecs update-service \
            --cluster "${{ steps.cfg.outputs.cluster }}" \
            --service "${{ steps.cfg.outputs.service }}" \
            --task-definition "${{ steps.register.outputs.task_definition }}"

      - name: Wait for service stability
        shell: bash
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.cfg.outputs.cluster }}" \
            --services "${{ steps.cfg.outputs.service }}"

      - name: Smoke test API health
        shell: bash
        run: |
          curl --fail --silent --show-error "${{ steps.cfg.outputs.health_url }}"

      - name: Rollback to previous task definition on failure
        if: failure()
        shell: bash
        run: |
          aws ecs update-service \
            --cluster "${{ steps.cfg.outputs.cluster }}" \
            --service "${{ steps.cfg.outputs.service }}" \
            --task-definition "${{ steps.previous.outputs.current_task_definition }}"
          aws ecs wait services-stable \
            --cluster "${{ steps.cfg.outputs.cluster }}" \
            --services "${{ steps.cfg.outputs.service }}"
          exit 1

      - name: Notify deploy success
        if: success()
        shell: bash
        run: |
          MSG=$(printf '%s\n\nCommit: %s\nBranch: %s\nActor: %s\nTask: %s\nHealth: OK (%s)' \
            '✅ Deploy completed successfully.' \
            '${{ github.sha }}' \
            '${{ github.ref_name }}' \
            '${{ github.actor }}' \
            '${{ steps.register.outputs.task_definition }}' \
            '${{ steps.cfg.outputs.health_url }}')
          aws sns publish \
            --topic-arn "arn:aws:sns:ap-southeast-1:292773837061:pally-alerts" \
            --subject "[Pally] Deploy SUCCESS - ${{ github.sha }}" \
            --message "$MSG"

      - name: Notify deploy failure
        if: failure()
        shell: bash
        run: |
          LOG_URL='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          MSG=$(printf '%s\n\nCommit: %s\nBranch: %s\nActor: %s\nRolled back to: %s\nCheck logs: %s' \
            '❌ Deploy failed and rolled back.' \
            '${{ github.sha }}' \
            '${{ github.ref_name }}' \
            '${{ github.actor }}' \
            '${{ steps.previous.outputs.current_task_definition }}' \
            "$LOG_URL")
          aws sns publish \
            --topic-arn "arn:aws:sns:ap-southeast-1:292773837061:pally-alerts" \
            --subject "[Pally] Deploy FAILED - ${{ github.sha }}" \
            --message "$MSG"

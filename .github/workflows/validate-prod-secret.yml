name: Validate production secret JSON

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Secrets Manager name"
        required: true
        default: "virfriendo/prod/database"

permissions:
  contents: read

jobs:
  validate-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch secret JSON
        shell: bash
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "${{ inputs.secret_name }}" \
            --query 'SecretString' \
            --output text > secret.json

      - name: Validate secret schema
        run: python .github/scripts/validate_secret_json.py secret.json
